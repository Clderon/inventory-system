services:
  web:
    image: php:7.4-apache
    ports: ["8080:80"]
    volumes: [".:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "docker-php-ext-install mysqli && apache2-foreground"
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oswa_inv
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
    volumes:
      - ./oswa_inv.sql:/docker-entrypoint-initdb.d/oswa_inv.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
